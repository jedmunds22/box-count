<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Box Count">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Box Count</title>
<style>
:root{
  --bg:#f4f5f9; --surface:#ffffff; --surface2:#eceef5; --text:#14161c; --muted:#5e6577; --line:#dfe2ec;
  --accent:#5a68d8; --accent-ink:#ffffff; --ok:#16864a; --plus:#7a4bd0; --bad:#c9362f; --undo:#4b5262;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1015; --surface:#181b22; --surface2:#21252e; --text:#eef0f5; --muted:#9aa1b2; --line:#2b303b;
    --accent:#7f8cf0; --accent-ink:#0e1015; --ok:#2fb36b; --plus:#9b74e8; --bad:#e2564e; --undo:#6b7385;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px}
.top h1{font-size:20px;margin:0;letter-spacing:-.01em}
.total{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* camera */
.cam{position:relative;height:34vh;min-height:200px;max-height:340px;border-radius:var(--radius);overflow:hidden;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.75);border-radius:10px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
.guide::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:rgba(255,80,80,.8)}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:rgba(10,12,18,.82);color:#fff;font-size:19px;font-weight:700}
.start small{font-size:14px;font-weight:500;opacity:.8;max-width:80%;text-align:center}
.torch{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.torch[aria-pressed="true"]{background:#ffd54a;color:#111}

/* last scan */
.last{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.last-name{font-size:22px;font-weight:750;line-height:1.2;min-height:27px}
.last-name.muted{font-size:16px;font-weight:500;color:var(--muted)}
.last-code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:2px;min-height:18px}
.last-actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:13px 10px;border-radius:12px;background:var(--surface2);font-weight:650;font-size:16px;text-align:center}
.btn:disabled{opacity:.4}
.btn.undo{background:var(--undo);color:#fff}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}

/* list */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:600}
.chip b{font-variant-numeric:tabular-nums}
.group{margin:16px 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
.row-name{flex:1;font-weight:600}
.row-name .sub{display:block;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-weight:400;margin-top:1px}
.row-count{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row.plus .row-count{color:var(--plus)}
.row.bad .row-name{color:var(--bad)}
.row-detail{display:none;padding:0 14px 12px}
.row.open .row-detail{display:block}
.code-line{display:flex;align-items:center;gap:8px;padding:6px 0}
.code-line code{flex:1;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
.code-line .n{font-variant-numeric:tabular-nums;font-weight:700;min-width:2ch;text-align:right}
.adj{width:40px;height:36px;border-radius:10px;background:var(--surface2);font-size:20px;font-weight:700}
.empty{padding:18px 14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 2px}

/* history */
details.hist{margin-top:18px}
details.hist summary{font-weight:650;padding:6px 2px;color:var(--muted)}
.hist ol{list-style:none;margin:6px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-height:50vh;overflow:auto}
.hist li{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:5.5em}
.hist .typed{color:var(--muted);font-size:12px}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;gap:8px}

/* flash */
.flash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:24px;text-align:center;color:#fff;opacity:0;pointer-events:none;transition:opacity .18s ease-out}
.flash.show{opacity:1;transition:none}
.flash.ok{background:var(--ok)} .flash.plus{background:var(--plus)} .flash.bad{background:var(--bad)} .flash.undo{background:var(--undo)}
.flash-name{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.flash-sub{font:16px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.9}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hapt{position:fixed;left:-200px;top:0;opacity:.01;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Box Count</h1>
    <span class="total" id="total" aria-live="polite">0 scanned</span>
  </header>

  <div class="seg" role="radiogroup" aria-label="Where are you counting" id="where">
    <button role="radio" data-v="Apartment">Apartment</button>
    <button role="radio" data-v="Storage">Storage</button>
    <button role="radio" data-v="Other">Other</button>
  </div>

  <section class="cam" aria-label="Camera">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide" aria-hidden="true"></div>
    <button class="start" id="startBtn"><span id="startText">Tap to start scanning</span><small id="startSub">Point the red line across a box label.</small></button>
    <button class="torch" id="torchBtn" aria-pressed="false" hidden>Light</button>
  </section>

  <section class="last" aria-live="polite">
    <div class="last-name muted" id="lastName">No scans yet</div>
    <div class="last-code" id="lastCode"></div>
    <div class="last-actions">
      <button class="btn undo" id="undoBtn" disabled>Undo last scan</button>
      <button class="btn" id="againBtn" disabled>+1 same box</button>
    </div>
  </section>

  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <p class="note">The count is saved on this phone until you tap New count. Tap a line to fix it by hand.</p>

  <details class="hist">
    <summary id="histTitle">Scan history</summary>
    <ol id="hist"></ol>
  </details>
</div>

<footer class="foot">
  <div class="wrap">
    <button class="btn primary" id="shareBtn">Share</button>
    <button class="btn" id="copyBtn">Copy text</button>
    <button class="btn danger" id="newBtn">New count</button>
  </div>
</footer>

<div class="flash" id="flash" aria-hidden="true"><div class="flash-name" id="flashName"></div><div class="flash-sub" id="flashSub"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="checkbox" switch id="hapt" class="hapt" tabindex="-1" aria-hidden="true"><label for="hapt" id="haptL" class="hapt" aria-hidden="true">.</label>

<script src="vendor/barcode-detector-3.2.3-ponyfill.js"></script>
<script>
(() => {
'use strict';

/* ---------- products and label aliases ---------- */
const SIZES = {K: 'King', Q: 'Queen', CK: 'Cal King'};
const COLORS = {W: 'White', S: 'Stone', N: 'Navy', SL: 'Slate'};
const PRODUCTS = {};
let ord = 0;
for (const sz of ['K', 'Q'])
  for (const [suf, tier] of [['DA', 'All-Season'], ['D', 'Down'], ['DA-LW', 'Lightweight']])
    for (const c of ['W', 'S', 'N', 'SL'])
      PRODUCTS[`COMF-${sz}-${c}-${suf}`] = {name: `${SIZES[sz]} ${COLORS[c]} ${tier}`, kind: 'comforter', ord: ord++};
for (const sz of ['K', 'Q'])
  for (const c of ['W', 'S', 'N', 'SL'])
    PRODUCTS[`COMF-${sz}-${c}-DA-PL`] = {name: `${SIZES[sz]} ${COLORS[c]} All-Season Plus`, kind: 'plus', ord: ord++};
for (const sz of ['K', 'Q', 'CK'])
  for (const c of ['W', 'S', 'N', 'SL'])
    PRODUCTS[`SHEETB-${sz}-${c}`] = {name: `${SIZES[sz]} ${COLORS[c]} Sheet Set`, kind: 'other', ord: ord++};
for (const sz of ['K', 'Q'])
  for (const c of ['W', 'S', 'N', 'SL'])
    PRODUCTS[`PC-${sz}-${c}`] = {name: `${SIZES[sz]} ${COLORS[c]} Pillowcases`, kind: 'other', ord: ord++};

// Order 1 (SD-…) and Order 2 (…-B) labels. Order 2 King All-Season boxes are All-Season Plus.
const ALIASES = {
  'SD-K-W-DA': 'COMF-K-W-DA', 'SD-K-ST-DA': 'COMF-K-S-DA', 'SD-Q-W-DA': 'COMF-Q-W-DA', 'SD-Q-ST-DA': 'COMF-Q-S-DA',
  'SD-K-W-D': 'COMF-K-W-D', 'SD-Q-W-D': 'COMF-Q-W-D',
  'Q-W-DA-B': 'COMF-Q-W-DA', 'Q-ST-DA-B': 'COMF-Q-S-DA', 'Q-W-D-B': 'COMF-Q-W-D',
  'K-W-D-B': 'COMF-K-W-D', 'K-ST-D-B': 'COMF-K-S-D',
  'K-W-DA-B': 'COMF-K-W-DA-PL', 'K-ST-DA-B': 'COMF-K-S-DA-PL'
};
const GROUPS = [['comforter', 'Comforters'], ['plus', 'All-Season Plus'], ['other', 'Sheets and pillowcases'], ['unknown', 'Not recognized']];

function norm(code) { return String(code).trim().toUpperCase(); }
function resolve(code) {
  const c = norm(code);
  const sku = PRODUCTS[c] ? c : ALIASES[c];
  return sku ? {code: c, sku, ...PRODUCTS[sku]} : {code: c, sku: '', name: c, kind: 'unknown', ord: 9999};
}

/* ---------- saved state ---------- */
const KEY = 'boxcount.v1';
function fresh(where) { return {v: 1, where: where || 'Apartment', started: Date.now(), scans: []}; }
let state = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && Array.isArray(s.scans)) state = s; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const video = $('video'), startBtn = $('startBtn'), torchBtn = $('torchBtn');
const undoBtn = $('undoBtn'), againBtn = $('againBtn');

/* ---------- feedback: sound, haptic, flash ---------- */
let ac = null;
function audio() {
  if (!ac) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  }
  if (ac && ac.state !== 'running') ac.resume().catch(() => {});
  return ac;
}
function tone(freq, at, dur, type, vol) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.22, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
const SOUNDS = {
  ok: () => tone(1950, 0, 0.11),
  plus: () => { tone(1950, 0, 0.08); tone(2600, 0.11, 0.08); },
  bad: () => { tone(300, 0, 0.16, 'sawtooth', 0.28); tone(300, 0.2, 0.16, 'sawtooth', 0.28); },
  undo: () => { tone(760, 0, 0.08, 'sine', 0.3); tone(520, 0.09, 0.11, 'sine', 0.3); }
};
function haptic() {
  try { if (typeof navigator.vibrate === 'function' && navigator.vibrate(60)) return; } catch (e) {}
  try { $('haptL').click(); } catch (e) {}   // iOS switch haptic; may only fire after a tap
}
let flashTimer = 0;
function flash(kind, name, sub) {
  const f = $('flash');
  f.className = 'flash show ' + kind;
  $('flashName').textContent = name; $('flashSub').textContent = sub || '';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.className = 'flash ' + kind; }, kind === 'bad' ? 1100 : 650);
}
let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- counting ---------- */
function register(code, typed) {
  const r = resolve(code);
  state.scans.push(typed ? {c: r.code, t: Date.now(), m: 1} : {c: r.code, t: Date.now()});
  save(); render();
  const n = state.scans.filter(s => resolve(s.c).sku === r.sku && (r.sku || s.c === r.code)).length;
  const sub = r.kind === 'unknown' ? 'Not a known label. Counted under Not recognized.'
    : (r.code === r.sku ? r.code : `${r.code} = ${r.sku}`) + `  ·  ${n} so far`;
  flash(r.kind === 'unknown' ? 'bad' : r.kind === 'plus' ? 'plus' : 'ok', r.name, sub);
  (SOUNDS[r.kind === 'unknown' ? 'bad' : r.kind === 'plus' ? 'plus' : 'ok'])();
  haptic();
}
function undo() {
  const s = state.scans.pop(); if (!s) return;
  save(); render();
  const r = resolve(s.c);
  flash('undo', 'Undone', r.name); SOUNDS.undo(); haptic();
}
function removeLast(code) {
  for (let i = state.scans.length - 1; i >= 0; i--) if (state.scans[i].c === code) { state.scans.splice(i, 1); break; }
  save(); render(); SOUNDS.undo();
}

function tally() {
  const by = new Map();
  for (const s of state.scans) {
    const r = resolve(s.c);
    const key = r.sku || 'UNKNOWN:' + r.code;
    if (!by.has(key)) by.set(key, {key, r, n: 0, codes: new Map()});
    const g = by.get(key); g.n++; g.codes.set(r.code, (g.codes.get(r.code) || 0) + 1);
  }
  return [...by.values()].sort((a, b) => a.r.ord - b.r.ord || a.r.name.localeCompare(b.r.name));
}

/* ---------- render ---------- */
const openRows = new Set();
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fmtTime(t) { return new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', second: '2-digit'}); }

function render() {
  for (const b of $('where').children) b.setAttribute('aria-checked', String(b.dataset.v === state.where));
  const rows = tally();
  const kinds = {comforter: 0, plus: 0, other: 0, unknown: 0};
  for (const g of rows) kinds[g.r.kind] += g.n;
  $('total').textContent = `${state.scans.length} scanned`;

  const sum = $('summary'); sum.replaceChildren();
  const chip = (n, label) => { const c = el('span', 'chip'); const b = el('b', null, String(n)); c.append(b, ' ' + label); sum.append(c); };
  chip(kinds.comforter, kinds.comforter === 1 ? 'comforter' : 'comforters');
  if (kinds.plus) chip(kinds.plus, 'All-Season Plus');
  if (kinds.other) chip(kinds.other, 'sheets/pillowcases');
  if (kinds.unknown) chip(kinds.unknown, 'not recognized');

  const list = $('list'); list.replaceChildren();
  if (!rows.length) { const box = el('div', 'rows'); box.append(el('div', 'empty', 'Nothing counted yet.')); list.append(box); }
  for (const [kind, title] of GROUPS) {
    const gs = rows.filter(g => g.r.kind === kind); if (!gs.length) continue;
    list.append(el('div', 'group', `${title} · ${gs.reduce((a, g) => a + g.n, 0)}`));
    const box = el('div', 'rows');
    for (const g of gs) {
      const row = el('div', 'row' + (kind === 'plus' ? ' plus' : kind === 'unknown' ? ' bad' : '') + (openRows.has(g.key) ? ' open' : ''));
      const main = el('button', 'row-main'); main.setAttribute('aria-expanded', String(openRows.has(g.key)));
      const name = el('span', 'row-name', g.r.name);
      if (kind !== 'unknown') name.append(el('span', 'sub', [...g.codes.keys()].join(' · ')));
      main.append(name, el('span', 'row-count', String(g.n)));
      main.onclick = () => { openRows.has(g.key) ? openRows.delete(g.key) : openRows.add(g.key); render(); };
      const det = el('div', 'row-detail');
      for (const [code, n] of g.codes) {
        const line = el('div', 'code-line');
        const minus = el('button', 'adj', '−'); minus.setAttribute('aria-label', `Remove one ${code}`);
        const plus = el('button', 'adj', '+'); plus.setAttribute('aria-label', `Add one ${code}`);
        minus.onclick = () => removeLast(code);
        plus.onclick = () => register(code, true);
        line.append(el('code', null, code), el('span', 'n', String(n)), minus, plus);
        det.append(line);
      }
      row.append(main, det); box.append(row);
    }
    list.append(box);
  }

  const last = state.scans[state.scans.length - 1];
  if (last) { const r = resolve(last.c); $('lastName').textContent = r.name; $('lastName').className = 'last-name'; $('lastCode').textContent = `${r.code} · ${fmtTime(last.t)}`; }
  else { $('lastName').textContent = 'No scans yet'; $('lastName').className = 'last-name muted'; $('lastCode').textContent = ''; }
  undoBtn.disabled = !last; againBtn.disabled = !last;

  const hist = $('hist'); hist.replaceChildren();
  for (let i = state.scans.length - 1; i >= 0; i--) {
    const s = state.scans[i], r = resolve(s.c), li = el('li');
    const t = el('time', null, fmtTime(s.t));
    const what = el('span', null, `${r.name} `); what.append(el('span', 'typed', s.m ? '(added by hand)' : r.code));
    li.append(t, what); hist.append(li);
  }
  $('histTitle').textContent = `Scan history (${state.scans.length})`;
}

/* ---------- export ---------- */
function stamp() {
  const d = new Date(state.scans.length ? state.scans[state.scans.length - 1].t : Date.now());
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function csvCell(v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function buildCsv() {
  const when = new Date(state.scans.length ? state.scans[state.scans.length - 1].t : Date.now()).toISOString();
  const out = [['count_name', 'counted_at', 'type', 'product', 'sku', 'label_code', 'count']];
  for (const g of tally()) for (const [code, n] of g.codes)
    out.push([state.where, when, g.r.kind, g.r.kind === 'unknown' ? '' : g.r.name, g.r.sku, code, n]);
  return out.map(r => r.map(csvCell).join(',')).join('\n') + '\n';
}
function buildText() {
  const rows = tally(), kinds = {comforter: 0, plus: 0, other: 0, unknown: 0};
  for (const g of rows) kinds[g.r.kind] += g.n;
  const d = new Date(state.scans.length ? state.scans[state.scans.length - 1].t : Date.now());
  const lines = [`Box count: ${state.where}, ${d.toLocaleString([], {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})}`,
    `${kinds.comforter} comforters · ${kinds.plus} All-Season Plus · ${kinds.other} sheets/pillowcases · ${kinds.unknown} not recognized`, ''];
  for (const [kind, title] of GROUPS) {
    const gs = rows.filter(g => g.r.kind === kind); if (!gs.length) continue;
    lines.push(title + ':');
    for (const g of gs) lines.push(`${g.r.name}: ${g.n} (${[...g.codes].map(([c, n]) => `${c} ${n}`).join(', ')})`);
    lines.push('');
  }
  return lines.join('\n').trim() + '\n';
}
async function share() {
  if (!state.scans.length) { toast('Nothing to share yet'); return; }
  const name = `BoxCount_${state.where}_${stamp()}.csv`;
  const file = new File([buildCsv()], name, {type: 'text/csv'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = el('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function copyText() {
  if (!state.scans.length) { toast('Nothing to copy yet'); return; }
  const text = buildText();
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into Claude.'); }
  catch (e) {
    const ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta);
    ta.select(); try { document.execCommand('copy'); toast('Copied. Paste it into Claude.'); } catch (e2) { toast('Copy failed'); } ta.remove();
  }
}
function newCount() {
  const n = state.scans.length;
  if (n && !confirm(`Start a new count? This clears the ${n} scan${n === 1 ? '' : 's'} on this phone. Share them first if you still need them.`)) return;
  state = fresh(state.where); openRows.clear(); save(); render(); toast('New count started');
}

/* ---------- camera + scanning ---------- */
const API = window.BarcodeDetectionAPI;
let ready = null;
if (API) {
  ready = API.prepareZXingModule({
    overrides: {locateFile: (path, prefix) => path.endsWith('.wasm') ? new URL('vendor/' + path, location.href).href : prefix + path},
    fireImmediately: true
  });
}
let detector = null, stream = null, track = null, running = false, busy = false, wake = null;
let lastCode = '', lastSeen = 0;
const COOLDOWN = 1200;       // the same label must be out of view this long before it counts again
const MAX_W = 1600;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently: true});

function showStart(text, sub) { $('startText').textContent = text; $('startSub').textContent = sub || ''; startBtn.hidden = false; }

async function start() {
  audio();                                   // unlock sound inside the tap
  try { $('haptL').click(); } catch (e) {}
  if (!API) { showStart('Scanner did not load', 'Reload the page.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showStart('No camera access here', 'Open this page in Safari.'); return; }
  showStart('Starting camera…', '');
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}});
  } catch (e) {
    showStart('Camera blocked', 'Allow the camera for this site in Safari, then tap again.'); return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  track = stream.getVideoTracks()[0];
  try { const caps = track.getCapabilities ? track.getCapabilities() : {}; torchBtn.hidden = !caps.torch; } catch (e) { torchBtn.hidden = true; }
  try { await ready; } catch (e) {}
  if (!detector) detector = new API.BarcodeDetector({formats: ['code_128']});
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  startBtn.hidden = true; running = true; lastCode = ''; tick();
}
function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null; torchBtn.hidden = true; torchBtn.setAttribute('aria-pressed', 'false');
  try { if (wake) wake.release(); } catch (e) {} wake = null;
}
let pending = false;
function tick() {
  // next video frame, or 150 ms, whichever comes first (frame callbacks can stall, e.g. in a background tab)
  if (!running || pending) return;
  pending = true;
  let done = false, id = 0;
  const go = () => {
    if (done) return; done = true; pending = false;
    if (id && video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(id);
    scanFrame();
  };
  if (video.requestVideoFrameCallback) id = video.requestVideoFrameCallback(go);
  setTimeout(go, 150);
}
async function scanFrame() {
  if (!running) return;
  if (busy || video.readyState < 2 || !video.videoWidth) { tick(); return; }
  busy = true;
  try {
    // decode exactly what is visible in the (object-fit: cover) viewfinder
    const vw = video.videoWidth, vh = video.videoHeight, box = video.getBoundingClientRect();
    const s = Math.max(box.width / vw, box.height / vh);
    const sw = Math.min(vw, box.width / s), sh = Math.min(vh, box.height / s);
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    const k = Math.min(1, MAX_W / sw);
    canvas.width = Math.round(sw * k); canvas.height = Math.round(sh * k);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    const found = await detector.detect(canvas);
    const now = performance.now();
    if (found.length) {
      const cx = canvas.width / 2, cy = canvas.height / 2;
      let best = null, bd = Infinity;
      for (const b of found) {
        const r = b.boundingBox, d = Math.hypot(r.x + r.width / 2 - cx, r.y + r.height / 2 - cy);
        if (b.rawValue && d < bd) { bd = d; best = b; }
      }
      if (best) {
        const code = norm(best.rawValue);
        if (code === lastCode && now - lastSeen < COOLDOWN) lastSeen = now;
        else { lastCode = code; lastSeen = now; register(code, false); }
      }
    }
  } catch (e) { /* skip this frame */ }
  busy = false;
  tick();
}

/* ---------- wiring ---------- */
startBtn.onclick = start;
torchBtn.onclick = async () => {
  if (!track) return;
  const on = torchBtn.getAttribute('aria-pressed') !== 'true';
  try { await track.applyConstraints({advanced: [{torch: on}]}); torchBtn.setAttribute('aria-pressed', String(on)); } catch (e) { toast('The light is not available'); }
};
undoBtn.onclick = undo;
againBtn.onclick = () => { const l = state.scans[state.scans.length - 1]; if (l) register(l.c, true); };
$('shareBtn').onclick = share;
$('copyBtn').onclick = copyText;
$('newBtn').onclick = newCount;
for (const b of $('where').children) b.onclick = () => { state.where = b.dataset.v; save(); render(); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) { stop(); showStart('Tap to resume scanning', 'Your count is saved.'); }
});

window.boxcount = {register, undo, resolve, buildCsv, buildText, state: () => state};   // for testing
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
